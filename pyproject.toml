[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asrbench"
version = "0.0.1"
description = "A protocol-level benchmark for streaming speech recognition servers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Pete Tanski" }]
keywords = ["asr", "speech-recognition", "benchmark", "streaming", "latency"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: System :: Benchmark",
]
# The measurement core is stdlib-only by design: it must run with no GPU, no
# server, and no transport library installed, or the framework is not publicly
# reproducible. Transports declare their own dependencies as extras.
dependencies = []

[project.optional-dependencies]
# One extra per transport, so installing the framework never pulls a client
# library for a protocol you are not measuring.
websocket = ["aiohttp>=3.10"]
riva = ["nvidia-riva-client>=2.26.0", "grpcio>=1.62"]
dev = [
    "pytest>=8",
    "mypy>=1.13",
    "ruff>=0.8",
    # Reads this file back in the boundary test; stdlib `tomllib` from 3.11.
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/pdtgct/asr-framework-benchmarking"
Issues = "https://github.com/pdtgct/asr-framework-benchmarking/issues"

[project.scripts]
asrbench = "asrbench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/asrbench"]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "D", "UP", "B", "SIM"]
# D203/D213 conflict with the Google convention's D211/D212.
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test names and docstrings carry the intent; module/function docstring
# requirements are not enforced on tests.
"tests/**" = ["D1"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*", "riva", "riva.*"]
ignore_missing_imports = true
# Deliberately no `python_version`: mypy checks against the interpreter that
# runs it, so each CI matrix leg type-checks the branches that leg actually
# executes. Pinning one version here would check a combination nothing runs.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: requires a running ASR server; excluded from the default tier",
]
