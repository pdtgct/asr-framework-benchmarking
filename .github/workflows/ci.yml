name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range. Everything in
        # between is covered by the same stdlib-only core.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Transport extras are installed so the adapters are type-checked and
      # the in-process riva tests run. The core boundary still forbids those
      # imports outside adapters. The riva tests skip when the extra is
      # absent, and the default suite does not dial a hosted server.
      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,websocket,riva]"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # No GPU and no hosted server. The riva extra supplies grpc so the
      # fake servicer can run in-process. A missing extra skips those tests;
      # it does not make the core import a transport library.
      - name: Tests
        run: uv run pytest -q
