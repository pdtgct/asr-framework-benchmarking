name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of the supported range. Everything in
        # between is covered by the same stdlib-only core.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      # Transport extras are installed so the adapters are type-checked. The
      # tests themselves must still pass without them — that is what the
      # boundary test enforces.
      - name: Create the environment
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev,websocket]"

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # No GPU, no server, no transport library. If this job ever needs one,
      # the core has stopped being publicly runnable.
      - name: Tests
        run: uv run pytest -q
